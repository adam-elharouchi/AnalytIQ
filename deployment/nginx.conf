# ============================================================================
# ⚠  REFERENCE / LOCAL-DEV EXAMPLE ONLY — DO NOT DEPLOY AS-IS.
# Production runs on Render (see render.yaml) behind Cloudflare; this file is
# NOT used there. Known footguns if copied to a server verbatim:
#   - hardcoded local `root` path (update per host)
#   - `Access-Control-Allow-Origin '*'` (set an explicit allowlist instead)
#   - listens on :80 only with no TLS / HTTPS redirect (terminate TLS!)
# ============================================================================
# Nginx configuration for AnalytIQ
# Place this file in your nginx sites-available directory
# For macOS with Homebrew: /usr/local/etc/nginx/servers/
# For Linux: /etc/nginx/sites-available/

server {
    listen 80;
    server_name www.myanalytiq.org myanalytiq.org;

    # Logging
    access_log /var/log/nginx/analytiq_access.log;
    error_log /var/log/nginx/analytiq_error.log;

    # Maximum upload size
    client_max_body_size 10M;

    # Serve static files (frontend)
    location / {
        root /Users/aelharouchi/Documents/GitHub/AnalytIQ;  # UPDATE THIS PATH
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API requests to Flask backend
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers (if needed, though Flask handles this)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

