<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AnalytIQ - Data Analytics Learning Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/api-helper.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ui-states.js"></script>
  <script src="js/offline-detector.js"></script>

  <!-- LOCAL DEV ONLY: dark theme — remove before deploy -->
  <link rel="stylesheet" href="css/local-dev-light-theme.css" />
  <link rel="stylesheet" href="css/local-dev-dark-theme.css" />
  <script src="js/local-dev-dark-theme.js" defer></script>
</head>

<body class="home-page hero-bg-active">
  <!-- ══ LOCAL DEV ONLY: Animated Hero Background Scene ══
       Remove this block before any production deploy.
       Controlled by body.hero-bg-active + js/hero-bg-animation.js ══ -->
  <div class="hero-bg-scene" id="heroBgScene" aria-hidden="true">
    <!-- Far layer: faint drifting character columns -->
    <div class="hero-bg-layer-far" id="heroBgFar"></div>
    <!-- Mid layer: ghost code blocks scrolling up -->
    <div class="hero-bg-layer-mid" id="heroBgMid"></div>
    <!-- Foreground layer: floating IDE windows -->
    <div class="hero-bg-layer-fg" id="heroBgFg"></div>
    <!-- Readability overlay -->
    <div class="hero-bg-overlay"></div>
  </div>
  <!-- ══ END LOCAL DEV ONLY ══ -->

  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="home-layout">
      <div class="home-content-left">
        <div class="hero-section">
          <h1>Welcome to <span class="logo-analyt">Analyt</span><span class="logo-iq">IQ</span></h1>
          <p>Your comprehensive platform for mastering data analytics. Learn, practice, and master data analytics skills
            with interactive tools and resources.</p>
        </div>

        <div class="page-navigation-grid" id="pageNavigationGrid">
          <!-- Navigation cards will be dynamically generated based on user role -->
        </div>
      </div>

      <div class="home-content-right">
        <div class="code-animation-container">
          <div class="code-animation-header">
            <span class="code-animation-dot"></span>
            <span class="code-animation-dot"></span>
            <span class="code-animation-dot"></span>
            <span class="code-animation-filename">df_AnalytIQ</span>
          </div>
          <div class="code-animation-content">
            <pre id="codeAnimation"><span class="code-line"></span></pre>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="home-footer" role="contentinfo">
    <div class="container home-footer-inner">
      <div class="home-footer-top-row">
        <div class="home-footer-left-links" id="footerLeftLinks">
          <!-- Portal-specific links will be dynamically inserted here -->
        </div>
        <div class="home-footer-brand-center">
          <div class="home-footer-brand"><span class="logo-analyt">Analyt</span><span class="logo-iq">IQ</span></div>
        </div>
        <div class="home-footer-right-links" id="footerRightLinks">
          <!-- Portal-specific links will be dynamically inserted here -->
        </div>
      </div>
      <div class="home-footer-bottom-row">
        <div class="home-footer-text-line">Your comprehensive platform for mastering data analytics © <span
            id="footerYear"></span> AnalytIQ. All rights reserved. Adam El Harouchi.</div>
      </div>
    </div>
  </footer>

  <!-- JS load order: api-helper.js (head) → home-animation.js → auth.js → navigation.js -->
  <script src="js/home-animation.js"></script>

  <!-- LOCAL DEV ONLY: Hero animated background — remove before deploy -->
  <script src="js/hero-bg-animation.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    // Require authentication for entire website
    document.addEventListener('DOMContentLoaded', function () {
      const authManager = new AuthManager();
      if (!authManager.requireAuth()) {
        return; // Will redirect to login
      }

      // Generate navigation cards based on user role
      const currentUser = authManager.getCurrentUser();
      const isProfessor = currentUser && currentUser.role === 'professor';

      const navigationGrid = document.getElementById('pageNavigationGrid');

      if (isProfessor) {
        // Professor navigation cards: Dashboard, Code, Profile
        navigationGrid.innerHTML = `
          <a href="professor-dashboard.html" class="page-nav-card">
            <div class="page-nav-icon">📊</div>
            <h2>Dashboard</h2>
            <p>Manage your classes, upload modules, create exercises, and track student progress.</p>
          </a>

          <a href="code-assistant.html" class="page-nav-card">
            <div class="page-nav-icon">🔧</div>
            <h2>Code</h2>
            <p>AI-powered assistant that helps you write code, analyze data, derive insights, and create visualizations.</p>
          </a>

          <a href="profile.html" class="page-nav-card">
            <div class="page-nav-icon">👤</div>
            <h2>Profile</h2>
            <p>Manage your profile information, update your account settings, and customize your preferences.</p>
          </a>
        `;
      } else {
        // Student navigation cards: My Classes, Code, Profile
        navigationGrid.innerHTML = `
          <a href="student-classes.html" class="page-nav-card">
            <div class="page-nav-icon">📚</div>
            <h2>My Classes</h2>
            <p>Access your enrolled classes, view modules, practice exercises, and resources for each course.</p>
          </a>

          <a href="code-assistant.html" class="page-nav-card">
            <div class="page-nav-icon">🔧</div>
            <h2>Code</h2>
            <p>AI-powered assistant that helps you write code, analyze data, derive insights, and create visualizations.</p>
          </a>

          <a href="profile.html" class="page-nav-card">
            <div class="page-nav-icon">👤</div>
            <h2>Profile</h2>
            <p>Manage your profile information, update your account settings, and customize your preferences.</p>
          </a>
        `;
      }

      // Footer year
      const yearEl = document.getElementById('footerYear');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Set footer links based on role (balanced around centered logo)
      const footerLeftLinks = document.getElementById('footerLeftLinks');
      const footerRightLinks = document.getElementById('footerRightLinks');

      if (footerLeftLinks && footerRightLinks) {
        if (isProfessor) {
          // Professor portal: Home, Dashboard, Code (left), Contact, Terms, Privacy (right)
          footerLeftLinks.innerHTML = `
            <a href="index.html">Home</a>
            <a href="professor-dashboard.html">Dashboard</a>
            <a href="code-assistant.html">Code</a>
          `;
          footerRightLinks.innerHTML = `
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms</a>
            <a href="privacy.html">Privacy</a>
          `;
        } else {
          // Student portal: My Classes, Profile, Code (left), Contact, Terms, Privacy (right)
          footerLeftLinks.innerHTML = `
            <a href="student-classes.html">My Classes</a>
            <a href="profile.html">Profile</a>
            <a href="code-assistant.html">Code</a>
          `;
          footerRightLinks.innerHTML = `
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms</a>
            <a href="privacy.html">Privacy</a>
          `;
        }
      }
    });
  </script>
</body>

</html>
