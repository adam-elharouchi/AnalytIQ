<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/api-helper.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ui-states.js"></script>
  <script src="js/offline-detector.js"></script>

  <!-- LOCAL DEV ONLY: dark theme — remove before deploy -->
  <link rel="stylesheet" href="css/local-dev-light-theme.css" />
  <link rel="stylesheet" href="css/local-dev-dark-theme.css" />
  <script src="js/local-dev-dark-theme.js" defer></script>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  
  <main class="container">
    <h1>Contact Us</h1>
    <p class="subtitle">Have a question or need help? We're here to assist you.</p>
    
    <div class="contact-container">
      <div class="contact-form-section contact-form-full">
        <h2>Send us a message</h2>
        <form id="contactForm" class="contact-form">
          <div class="form-group">
            <label for="contactName">Your Name</label>
            <input type="text" id="contactName" name="name" required placeholder="Enter your name" />
          </div>
          
          <div class="form-group">
            <label for="contactEmail">Your Email</label>
            <input type="email" id="contactEmail" name="email" required placeholder="your@email.com" />
          </div>
          
          <div class="form-group">
            <label for="contactSubject">Subject</label>
            <select id="contactSubject" name="subject" required>
              <option value="">Select a subject</option>
              <option value="technical">Technical Issue</option>
              <option value="feature">Feature Request</option>
              <option value="question">General Question</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" required rows="6" placeholder="Tell us how we can help..."></textarea>
          </div>
          
          <button type="submit" class="btn btn-primary">Send Message</button>
          <div id="contactMessageStatus" class="message-status" style="display: none;"></div>
        </form>
      </div>
    </div>
  </main>
  
  <!-- JS load order: api-helper.js (head) → auth.js → navigation.js → contact.js -->
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
