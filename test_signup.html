<!DOCTYPE html>
<html>
<head>
    <title>Test Signup</title>
</head>
<body>
    <h1>Test Signup Form</h1>
    <form id="testForm">
        <input type="text" id="name" placeholder="Name" value="Test User"><br><br>
        <input type="email" id="email" placeholder="Email" value="test2@example.com"><br><br>
        <input type="password" id="password" placeholder="Password" value="test123"><br><br>
        <button type="submit">Test Signup</button>
    </form>
    <div id="result"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Sending request...';
            
            try {
                const response = await fetch('http://localhost:5001/api/users/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerHTML = `<p style="color: green;">SUCCESS! User created: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">ERROR: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">EXCEPTION: ${error.message}</p>`;
                console.error('Full error:', error);
            }
        });
    </script>
</body>
</html>
