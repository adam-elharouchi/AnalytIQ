<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LTI Launch Error — AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    body {
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 420px;
      width: 90%;
    }
    .icon {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      color: #fbbf24;
    }
    h2 { margin: 0 0 .75rem; font-size: 1.25rem; color: #fca5a5; }
    p  { margin: 0 0 1.25rem; font-size: .9rem; color: #94a3b8; }
    .detail {
      padding: .75rem 1rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      font-size: .8rem;
      color: #fca5a5;
      word-break: break-word;
      text-align: left;
      margin-bottom: 1.25rem;
    }
    a {
      display: inline-block;
      padding: .6rem 1.5rem;
      background: #2569f4;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: .9rem;
    }
    a:hover { background: #1d58d8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <h2>LTI Launch Failed</h2>
    <p>There was a problem signing you in through your LMS.</p>
    {% if error %}
    <div class="detail">{{ error }}</div>
    {% endif %}
    <p>Please contact your instructor or try relaunching from your LMS.</p>
    <a href="/">Go to AnalytIQ</a>
  </div>
</body>
</html>
