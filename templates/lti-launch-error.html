<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LTI Launch Error — AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
      color: #374151;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 420px;
      width: 90%;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.25rem; color: #b91c1c; }
    p  { margin: 0 0 1.25rem; font-size: .9rem; color: #6b7280; }
    .detail {
      padding: .75rem 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: .8rem;
      color: #7f1d1d;
      word-break: break-word;
      text-align: left;
      margin-bottom: 1.25rem;
    }
    a {
      display: inline-block;
      padding: .6rem 1.5rem;
      background: #6366f1;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x26A0;&#xFE0F;</div>
    <h2>LTI Launch Failed</h2>
    <p>There was a problem signing you in through your LMS.</p>
    {% if error %}
    <div class="detail">{{ error }}</div>
    {% endif %}
    <p>Please contact your instructor or try relaunching from your LMS.</p>
    <a href="/">Go to AnalytIQ</a>
  </div>
</body>
</html>
