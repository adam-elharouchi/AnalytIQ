<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">Portfolio | AnalytIQ</title>

  <!-- OG / social tags (populated by JS after fetch) -->
  <meta property="og:title" content="" id="ogTitle" />
  <meta property="og:description" content="" id="ogDesc" />
  <meta property="og:url" content="" id="ogUrl" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/styles.css" />

  <!-- highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body { background: var(--bg-primary, #0f172a); color: var(--text-primary, #f0f4ff); }

    .pub-page { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    .pub-header {
      background: var(--bg-card, rgba(34,44,62,0.82));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .pub-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.12);
    }

    .pub-name { font-size: 1.75rem; font-weight: 700; margin: 0 0 0.35rem; }
    .pub-headline { color: #94a3b8; font-size: 0.95rem; margin: 0 0 0.75rem; }
    .pub-bio { color: #94a3b8; font-size: 0.875rem; line-height: 1.65; margin: 0 0 1rem; }

    .pub-links { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .pub-link {
      display: flex; align-items: center; gap: 0.4rem;
      color: var(--color-primary, #2569f4); font-size: 0.875rem;
      text-decoration: none; padding: 0.35rem 0.75rem;
      border: 1px solid rgba(37,105,244,0.25); border-radius: 0.375rem;
      transition: border-color 0.15s;
    }
    .pub-link:hover { border-color: var(--color-primary); }

    .pub-section-title {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #64748b; margin: 0 0 1rem;
    }

    .pub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .pub-card {
      background: var(--bg-card, rgba(34,44,62,0.82));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.75rem;
      padding: 1.25rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .pub-card:hover { border-color: rgba(37,105,244,0.35); transform: translateY(-2px); }
    .pub-card.expanded { border-color: rgba(37,105,244,0.5); border-radius: 0.75rem 0.75rem 0 0; transform: none; }

    .pub-card-title { font-weight: 600; color: #f8fafc; font-size: 0.95rem; margin: 0 0 0.5rem; }

    .pub-chevron {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; flex-shrink: 0;
      color: #475569; transition: transform 0.2s, color 0.2s;
    }
    .pub-card.expanded .pub-chevron { transform: rotate(180deg); color: var(--color-primary); }
    .pub-card-source { color: #64748b; font-size: 0.8rem; margin-top: 0.75rem; }

    .lang-badge {
      display: inline-block; padding: 0.15rem 0.55rem;
      border-radius: 0.25rem; font-size: 0.72rem; font-weight: 700;
    }

    /* Expanded detail */
    .pub-detail {
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(37,105,244,0.3);
      border-top: none;
      border-radius: 0 0 0.75rem 0.75rem;
      padding: 1.5rem;
      margin-top: 0;
      grid-column: 1 / -1;
    }
    .pub-detail.open { display: block; }

    .pub-detail pre { margin: 0; border-radius: 0.5rem; font-size: 0.82rem; max-height: 400px; overflow-y: auto; }

    .copy-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8; padding: 0.3rem 0.75rem; border-radius: 0.375rem;
      cursor: pointer; font-size: 0.78rem; transition: background 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.12); }

    .pub-footer {
      text-align: center; color: #475569; font-size: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.06); padding-top: 2rem; margin-top: 3rem;
    }
    .pub-footer a { color: var(--color-primary); text-decoration: none; }

    .private-state, .not-found-state {
      text-align: center; padding: 6rem 2rem; color: #64748b;
    }
    .private-state h1, .not-found-state h1 { color: #f8fafc; font-size: 1.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<div id="loadingState" style="text-align:center;padding:6rem 2rem;color:#64748b;">
  <div style="display:flex;justify-content:center;gap:0.5rem;margin-bottom:1rem;">
    <span style="width:8px;height:8px;border-radius:50%;background:#2569f4;animation:blink 1.2s 0s infinite both;display:inline-block;"></span>
    <span style="width:8px;height:8px;border-radius:50%;background:#2569f4;animation:blink 1.2s 0.2s infinite both;display:inline-block;"></span>
    <span style="width:8px;height:8px;border-radius:50%;background:#2569f4;animation:blink 1.2s 0.4s infinite both;display:inline-block;"></span>
  </div>
  Loading portfolio...
</div>

<div id="privateState" class="private-state" style="display:none;">
  <h1>This portfolio is private</h1>
  <p>The owner hasn't made this portfolio public yet.</p>
  <a href="/" style="color:var(--color-primary);">← Back to AnalytIQ</a>
</div>

<div id="notFoundState" class="not-found-state" style="display:none;">
  <h1>Portfolio not found</h1>
  <p>This portfolio doesn't exist or the link may be incorrect.</p>
  <a href="/" style="color:var(--color-primary);">← Back to AnalytIQ</a>
</div>

<div id="pubPage" class="pub-page" style="display:none;">

  <div class="pub-header">
    <img id="pubAvatar" class="pub-avatar" src="" alt="Profile picture"
         class="pf-avatar" data-fallback="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzMzNDE1NSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjQwIiBmaWxsPSIjOTRhM2I4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+8J+RpTwvdGV4dD48L3N2Zz4=" />
    <div style="flex:1;min-width:0;">
      <h1 class="pub-name" id="pubName"></h1>
      <p class="pub-headline" id="pubHeadline" style="display:none;"></p>
      <p class="pub-bio" id="pubBio" style="display:none;"></p>
      <div class="pub-links" id="pubLinks"></div>
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <div style="color:#64748b;font-size:0.78rem;" id="viewCount"></div>
    </div>
  </div>

  <!-- Pinned -->
  <div id="pinnedSection" style="display:none;margin-bottom:2.5rem;">
    <p class="pub-section-title">📌 Pinned</p>
    <div class="pub-grid" id="pinnedGrid"></div>
  </div>

  <!-- All Projects -->
  <div id="allSection">
    <p class="pub-section-title">All Projects</p>
    <div class="pub-grid" id="allGrid"></div>
  </div>

  <div class="pub-footer">
    Built with <a href="/">AnalytIQ</a> — The Executable Syllabus
  </div>
</div>

<script nonce="{{ csp_nonce }}">
const SLUG = {{ slug | tojson }};
const LANG_COLORS = { python:'#3b82f6', sql:'#f59e0b', r:'#10b981', javascript:'#f97316', java:'#8b5cf6' };
let openDetailId = null;

(async function init() {
  try {
    const res = await fetch(`/api/portfolio/public/${encodeURIComponent(SLUG)}`);
    const data = await res.json();

    document.getElementById('loadingState').style.display = 'none';

    if (res.status === 403) { document.getElementById('privateState').style.display = 'block'; return; }
    if (!res.ok) { document.getElementById('notFoundState').style.display = 'block'; return; }

    renderProfile(data.profile, data.view_count);
    renderItems(data.items);
    document.getElementById('pubPage').style.display = 'block';
  } catch(e) {
    document.getElementById('loadingState').innerHTML = '<p style="color:#ef4444;">Failed to load portfolio.</p>';
  }
})();

function renderProfile(p, viewCount) {
  const name = p.portfolio_title || (p.display_name ? p.display_name + "'s Portfolio" : 'Portfolio');
  document.getElementById('pubName').textContent = name;
  document.title = name + ' | AnalytIQ';
  document.getElementById('ogTitle').setAttribute('content', name);
  document.getElementById('ogUrl').setAttribute('content', window.location.href);

  if (p.avatar_url) {
    document.getElementById('pubAvatar').src = p.avatar_url;
  }

  if (p.headline) {
    const el = document.getElementById('pubHeadline');
    el.textContent = p.headline; el.style.display = 'block';
    document.getElementById('ogDesc').setAttribute('content', p.headline);
  }

  if (p.bio) {
    const el = document.getElementById('pubBio');
    el.textContent = p.bio; el.style.display = 'block';
  }

  const links = [];
  if (p.linkedin_url) links.push({ href: p.linkedin_url, label: 'LinkedIn', icon: 'in' });
  if (p.github_username) links.push({ href: `https://github.com/${p.github_username}`, label: 'GitHub', icon: '⌥' });
  if (p.personal_website) links.push({ href: p.personal_website, label: 'Website', icon: '🌐' });

  document.getElementById('pubLinks').innerHTML = links.map(l =>
    `<a href="${escHtml(l.href)}" target="_blank" rel="noopener noreferrer" class="pub-link">${escHtml(l.icon)} ${escHtml(l.label)}</a>`
  ).join('');

  if (viewCount > 0) {
    document.getElementById('viewCount').textContent = viewCount.toLocaleString() + ' views';
  }
}

function renderItems(items) {
  const pinned = items.filter(i => i.is_pinned);
  const all = items;

  if (pinned.length) {
    document.getElementById('pinnedSection').style.display = 'block';
    document.getElementById('pinnedGrid').innerHTML = pinned.map((item, idx) => renderCard(item, 'pinned', idx)).join('');
  }

  if (all.length) {
    document.getElementById('allGrid').innerHTML = all.map((item, idx) => renderCard(item, 'all', idx)).join('');
  } else {
    document.getElementById('allSection').innerHTML += '<p style="color:#64748b;font-size:0.875rem;">No projects published yet.</p>';
  }

  hljs.highlightAll();
}

function renderCard(item, prefix, idx) {
  const lang = item.language || 'python';
  const color = LANG_COLORS[lang] || '#64748b';
  const source = item.source_class_name || (item.item_type === 'personal_project' ? 'Personal Project' : 'External');
  const tags = (item.tags || []).slice(0, 3).map(t =>
    `<span style="background:rgba(255,255,255,0.06);border-radius:0.25rem;padding:0.15rem 0.45rem;font-size:0.72rem;color:#94a3b8;">${escHtml(t)}</span>`
  ).join('');
  const score = item.show_score && item.score != null ? `<span style="color:#10b981;font-size:0.78rem;">${Math.round(item.score)}%</span>` : '';

  // Build detail panel — always rendered so toggle always works
  let detailInner = '';
  if (item.description) {
    detailInner += `<p style="color:#94a3b8;font-size:0.875rem;line-height:1.6;margin:0 0 1rem;">${escHtml(item.description)}</p>`;
  }
  if (item.code_content) {
    const extMap = { python:'python', sql:'sql', r:'r', javascript:'javascript', java:'java' };
    const hlLang = extMap[lang] || 'plaintext';
    const codeEsc = escHtml(item.code_content);
    detailInner += `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;">
        <span style="color:#64748b;font-size:0.78rem;font-family:var(--font-mono);">${escHtml(lang)}</span>
        <button class="copy-btn" data-pa="copyCode" data-pa-self>Copy</button>
      </div>
      <pre><code class="language-${hlLang}">${codeEsc}</code></pre>`;
  }
  if (item.external_url) {
    detailInner += `<a href="${escHtml(item.external_url)}" target="_blank" rel="noopener noreferrer"
      style="display:inline-flex;align-items:center;gap:0.4rem;color:var(--color-primary);font-size:0.9rem;text-decoration:none;margin-top:${item.code_content?'1rem':'0'};">
      Open Project →</a>`;
  }
  if (!detailInner) {
    // Fallback: no code yet, show metadata
    const metaLines = [];
    if (item.source_class_name) metaLines.push(`<span>📚 ${escHtml(item.source_class_name)}</span>`);
    if (item.score != null) metaLines.push(`<span>✅ Score: ${Math.round(item.score)}%</span>`);
    if (item.completed_at) metaLines.push(`<span>📅 Completed ${new Date(item.completed_at).toLocaleDateString()}</span>`);
    detailInner = `<div style="display:flex;flex-wrap:wrap;gap:0.75rem;color:#64748b;font-size:0.85rem;">${metaLines.join('')}</div>
      <p style="color:#475569;font-size:0.8rem;margin:0.75rem 0 0;font-style:italic;">Code not yet published by the author.</p>`;
  }

  const detail = `<div class="pub-detail" id="detail-${prefix}-${idx}">${detailInner}</div>`;

  return `
    <div style="display:contents;">
      <div class="pub-card" id="card-${prefix}-${idx}" data-pa="toggleDetail" data-pa-args="[&quot;${prefix}&quot;, ${idx}]">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;margin-bottom:0.5rem;">
          <p class="pub-card-title">${escHtml(item.title)}</p>
          <div style="display:flex;align-items:center;gap:0.4rem;flex-shrink:0;">
            <span class="lang-badge" style="background:${color}22;color:${color};border:1px solid ${color}44;">${lang.toUpperCase()}</span>
            <span class="pub-chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </div>
        </div>
        ${tags ? `<div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">${tags}</div>` : ''}
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="pub-card-source">${escHtml(source)}</span>
          ${score}
        </div>
      </div>
      ${detail}
    </div>`;
}

function toggleDetail(prefix, idx) {
  const el = document.getElementById(`detail-${prefix}-${idx}`);
  const card = document.getElementById(`card-${prefix}-${idx}`);
  if (!el) return;
  const opening = !el.classList.contains('open');
  el.classList.toggle('open');
  if (card) card.classList.toggle('expanded', opening);
  if (opening) hljs.highlightAll();
}

function copyCode(btn) {
  const pre = btn.closest('.pub-detail').querySelector('pre code');
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

    // CSP: delegated dispatch for data-pa* attributes (replaces inline on* handlers).
    // data-pa values are author-controlled, so window[name] lookup is safe.
    (function () {
      function _args(el) {
        if (el.dataset.paArgs) { try { return JSON.parse(el.dataset.paArgs); } catch (_) { return []; } }
        if (el.dataset.paArg !== undefined) return [el.dataset.paArg];
        return [];
      }
      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-pa]');
        if (!el) return;
        var fn = window[el.dataset.pa];
        if (typeof fn !== 'function') return;
        var args = _args(el);
        if (el.hasAttribute('data-pa-self')) args = [el].concat(args);
        fn.apply(null, args);
      });
      document.addEventListener('change', function (e) {
        var el = e.target.closest('[data-pa-change]');
        if (!el) return;
        var fn = window[el.dataset.paChange];
        if (typeof fn === 'function') fn(e.target);
      });
    })();

    // CSP: avatar fallback (was an inline img onerror). error events don't bubble,
    // so this listener is registered in the capture phase.
    document.addEventListener('error', function (e) {
      var img = e.target;
      if (img && img.classList && img.classList.contains('pf-avatar') && img.dataset.fallback
          && img.src !== img.dataset.fallback) {
        img.src = img.dataset.fallback;
      }
    }, true);
  </script>
<style>
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
</style>
</body>
</html>
