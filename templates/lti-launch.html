<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing in via LMS — AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    body {
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #2569f4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 .5rem; font-size: 1.2rem; font-weight: 600; color: #f0f4ff; }
    p  { margin: 0; font-size: .9rem; color: #94a3b8; }
    .error-box {
      display: none;
      margin-top: 1rem;
      padding: .75rem 1rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      font-size: .85rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2>Signing you in&hellip;</h2>
    <p>Welcome{% if user_name %}, {{ user_name }}{% endif %}. Redirecting you now.</p>
    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      var token    = {{ jwt_token | tojson }};
      var refresh  = {{ refresh_token | tojson }};
      var redirect = {{ redirect_url | tojson }};

      try {
        localStorage.setItem('authToken', token);
        if (refresh) localStorage.setItem('refreshToken', refresh);
        // Decode payload for quick role/name access without another API call
        var parts = token.split('.');
        if (parts.length === 3) {
          var payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
          localStorage.setItem('currentUser', JSON.stringify({
            user_id: payload.user_id,
            name:    payload.name    || '',
            email:   payload.email   || '',
            role:    payload.role    || 'student'
          }));
        }
        window.location.href = redirect;
      } catch (e) {
        document.getElementById('spinner').style.display = 'none';
        var box = document.getElementById('errorBox');
        box.style.display = 'block';
        box.textContent = 'Could not store session. Please enable localStorage in your browser settings.';
      }
    })();
  </script>
</body>
</html>
