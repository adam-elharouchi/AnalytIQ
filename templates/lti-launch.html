<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing in via LMS — AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
      color: #374151;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 .5rem; font-size: 1.2rem; font-weight: 600; }
    p  { margin: 0; font-size: .9rem; color: #6b7280; }
    .error-box {
      display: none;
      margin-top: 1rem;
      padding: .75rem 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: .85rem;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2>Signing you in&hellip;</h2>
    <p>Welcome{% if user_name %}, {{ user_name }}{% endif %}. Redirecting you now.</p>
    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      var token    = {{ jwt_token | tojson }};
      var redirect = {{ redirect_url | tojson }};

      try {
        localStorage.setItem('authToken', token);
        // Decode payload for quick role/name access without another API call
        var parts = token.split('.');
        if (parts.length === 3) {
          var payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
          localStorage.setItem('currentUser', JSON.stringify({
            user_id: payload.user_id,
            name:    payload.name    || '',
            email:   payload.email   || '',
            role:    payload.role    || 'student'
          }));
        }
        window.location.href = redirect;
      } catch (e) {
        document.getElementById('spinner').style.display = 'none';
        var box = document.getElementById('errorBox');
        box.style.display = 'block';
        box.textContent = 'Could not store session. Please enable localStorage in your browser settings.';
      }
    })();
  </script>
</body>
</html>
