<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>{% block title %}AnalytIQ{% endblock %} - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <!-- JS load order — must not be reordered:
       1. api-helper.js    — defines authFetch() + window.API_BASE; consumed by all pages
       2. constants.js     — app-wide magic strings / feature flags (no deps)
       3. api-client.js    — higher-level typed wrappers around authFetch() (depends on 1 & 2)
       4. ui-states.js     — window.uiStates helpers: showLoading/showEmpty/showError (depends on 1)
       5. offline-detector.js — listens for online/offline events, shows banner (depends on 4)
       Per-page scripts are added via {% block extra_head %} after these globals are available. -->
  <script src="/static/js/api-helper.js?v=2.6"></script>
  <script src="/static/js/constants.js?v=2.6"></script>
  <script src="/static/js/api-client.js?v=2.6"></script>
  <script src="/static/js/ui-states.js?v=2.6"></script>
  <script src="/static/js/offline-detector.js?v=2.6"></script>
  {% block extra_head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>

  <!-- ===== Impersonation Bar =====
       Shown on every page when a superadmin is impersonating another user.
       Persists across navigation because original_token is in localStorage.  -->
  <div id="impersonation-bar"
       style="display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
              background:var(--color-warning, #d97706); color:#fff; padding:0.55rem 1.5rem;
              font-size:0.875rem; align-items:center; gap:1rem;
              box-shadow:0 2px 8px rgba(0,0,0,0.35);">
    <span style="flex:1;">Impersonating: <strong id="impersonation-bar-name"></strong></span>
    <span id="impersonation-bar-warn"
          style="display:none; background:rgba(255,255,255,0.25);
                 padding:0.15rem 0.6rem; border-radius:4px; font-size:0.8rem;">
      Session expires in &lt;5 min
    </span>
    <button onclick="window._exitImpersonation()"
            style="background:rgba(255,255,255,0.15); color:#fff;
                   border:1px solid rgba(255,255,255,0.45); padding:0.3rem 0.9rem;
                   border-radius:0.375rem; cursor:pointer; font-weight:600;
                   white-space:nowrap;">
      Exit Impersonation
    </button>
  </div>

  <script>
    /* ------------------------------------------------------------------
       Impersonation exit — callable from any page.
       Restores the original superadmin session and returns to the dashboard.
    ------------------------------------------------------------------ */
    window._exitImpersonation = function () {
      var orig = localStorage.getItem('original_token');
      var origUser = localStorage.getItem('original_user');
      if (orig) {
        localStorage.setItem('authToken', orig);
        localStorage.removeItem('original_token');
      }
      if (origUser) {
        localStorage.setItem('currentUser', origUser);
        localStorage.removeItem('original_user');
      }
      localStorage.removeItem('impersonation_started_at');
      window.location.href = '/superadmin-dashboard';
    };

    /* Activate the bar if an impersonation session is in progress */
    (function () {
      if (!localStorage.getItem('original_token')) return;

      var bar = document.getElementById('impersonation-bar');
      if (bar) {
        bar.style.display = 'flex';
        /* Push page content below the bar (44 px height) */
        document.body.style.paddingTop =
          (parseInt(document.body.style.paddingTop || '0', 10) + 44) + 'px';
      }

      try {
        var u = JSON.parse(localStorage.getItem('currentUser') || '{}');
        var el = document.getElementById('impersonation-bar-name');
        if (el) el.textContent = u.name || u.email || 'Unknown User';
      } catch (e) { /* ignore */ }

      /* Expiry timers (based on when impersonation started) */
      var startedAt = parseInt(localStorage.getItem('impersonation_started_at') || '0', 10);
      if (!startedAt) return;

      var elapsed  = Date.now() - startedAt;
      var _55min   = 55 * 60 * 1000;
      var _60min   = 60 * 60 * 1000;

      if (elapsed >= _60min) { window._exitImpersonation(); return; }

      var warnIn   = Math.max(0, _55min - elapsed);
      var expireIn = _60min - elapsed;

      if (warnIn === 0) {
        var wEl = document.getElementById('impersonation-bar-warn');
        if (wEl) wEl.style.display = 'inline';
      } else {
        setTimeout(function () {
          var wEl = document.getElementById('impersonation-bar-warn');
          if (wEl) wEl.style.display = 'inline';
        }, warnIn);
      }

      setTimeout(function () {
        window._exitImpersonation();
        alert('Impersonation session expired after 60 minutes.');
      }, expireIn);
    }());
  </script>

  <!-- ===== Announcement Banners =====
       Full-width top bars, stacked below the impersonation bar when active. -->
  <div id="announcement-banners"
       style="position:fixed; top:0; left:0; right:0; z-index:8900;
              display:flex; flex-direction:column; pointer-events:none;">
  </div>

  <script>
    /* Reposition announcement container below the impersonation bar (if shown),
       and update body paddingTop to keep page content clear of both bars. */
    function _updatePageTopOffset() {
      var impBar   = document.getElementById('impersonation-bar');
      var annWrap  = document.getElementById('announcement-banners');
      var impH = (impBar && impBar.style.display === 'flex')
                 ? (impBar.offsetHeight || 44) : 0;
      if (annWrap) annWrap.style.top = impH + 'px';
      var annH = annWrap ? annWrap.offsetHeight : 0;
      document.body.style.paddingTop = (impH + annH) + 'px';
    }

    function _dismissAnnouncement(btn) {
      var el = btn.closest('[data-ann-id]');
      if (el) el.remove();
      _updatePageTopOffset();
    }

    /* Fetch active announcements and render full-width top banner bars */
    (function () {
      var role = '', tenantId = '';
      try {
        var _cu = JSON.parse(localStorage.getItem('currentUser') || '{}');
        role     = _cu.role      || '';
        tenantId = _cu.tenant_id || '';
      } catch (e) {}

      var _params = [];
      if (role)     _params.push('role='      + encodeURIComponent(role));
      if (tenantId) _params.push('tenant_id=' + encodeURIComponent(tenantId));
      var url = '/api/platform/status' + (_params.length ? '?' + _params.join('&') : '');
      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          // --- Maintenance redirect ---
          if (data.maintenance) {
            var isSuperAdmin = (role === 'superadmin');
            if (!isSuperAdmin && !window.location.pathname.includes('login')) {
              document.body.innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100vh;'
                + 'font-family:sans-serif;text-align:center;padding:2rem;">'
                + '<div><h1 style="font-size:2rem;margin-bottom:1rem;">Maintenance</h1>'
                + '<p style="color:#64748b;">' + (data.maintenance_message || 'Platform under maintenance.') + '</p></div></div>';
              return;
            }
          }

          // --- Announcements ---
          var container = document.getElementById('announcement-banners');
          if (!container || !data.announcements || !data.announcements.length) return;

          var colorMap = {
            info:    '#2569f4',
            warning: '#f59e0b',
            danger:  '#dc2626',
            success: '#059669',
          };

          data.announcements.forEach(function (ann) {
            var bg = colorMap[ann.type] || colorMap.info;
            var el = document.createElement('div');
            el.setAttribute('data-ann-id', ann.id);
            el.style.cssText =
              'background:' + bg + ';color:#fff;'
              + 'padding:0.55rem 1.5rem;font-size:0.875rem;'
              + 'display:flex;align-items:center;gap:1rem;width:100%;'
              + 'box-shadow:0 2px 8px rgba(0,0,0,0.35);pointer-events:auto;';
            el.innerHTML =
              '<span style="flex:1;">'
              + '<strong>' + escapeAnnHtml(ann.title) + '</strong>'
              + ' \u2014 ' + escapeAnnHtml(ann.message)
              + '</span>'
              + '<button onclick="_dismissAnnouncement(this)"'
              + ' style="background:rgba(255,255,255,0.15);color:#fff;'
              + 'border:1px solid rgba(255,255,255,0.45);padding:0.3rem 0.9rem;'
              + 'border-radius:0.375rem;cursor:pointer;font-weight:600;white-space:nowrap;"'
              + ' aria-label="Dismiss">\u00d7</button>';
            container.appendChild(el);
          });

          // Position below impersonation bar and push page content down
          _updatePageTopOffset();
        })
        .catch(function () { /* fail silently */ });

      function escapeAnnHtml(s) {
        return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
    }());
  </script>

  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
  </body>

</html>
