{% extends "base.html" %}

{% block title %}Code{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<nav class="navbar" id="navbar"></nav>

  <main class="code-assistant-fullpage" id="codeAssistantPage">
    <!-- Collapsed Sidebar (Always Visible) -->
    <div class="collapsed-sidebar" id="collapsedSidebar">
      <button class="sidebar-logo-toggle" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
        <span class="logo-iq" aria-hidden="true">IQ</span>
      </button>
      <button class="sidebar-new-conversation-btn collapsed" onclick="startNewConversation()"
        title="New conversation" aria-label="New conversation">+</button>
    </div>

    <!-- Conversation History Sidebar -->
    <div class="conversation-sidebar" id="conversationSidebar">
      <div class="sidebar-header">
        <h3>Conversations</h3>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Hide sidebar" aria-label="Hide sidebar">←</button>
      </div>
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" onclick="switchConversationTab('active')" id="activeTab">Active</button>
        <button class="sidebar-tab" onclick="switchConversationTab('archived')" id="archivedTab">Archived</button>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <div class="conversation-list" id="conversationList">
          <p class="no-conversations">No previous conversations</p>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-main-area">
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-section" id="conversationStarters">
          <div class="welcome-message">
            <p>Hello! I'm your Code. Just type your request or paste your code below!</p>
          </div>
          <div class="conversation-starters">
            <div class="starter-grid">
              <button class="starter-btn" onclick="useStarter('Analyze sales data and create visualizations')">
                Analyze sales data and create visualizations
              </button>
              <button class="starter-btn" onclick="useStarter('Build a predictive model for customer churn')">
                Build a predictive model for customer churn
              </button>
              <button class="starter-btn" onclick="useStarter('Perform statistical analysis on revenue trends')">
                Perform statistical analysis on revenue trends
              </button>
              <button class="starter-btn" onclick="useStarter('Create a dashboard for business metrics')">
                Create a dashboard for business metrics
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-input-area-fixed">
        <div class="input-container-compact">
          <div class="input-wrapper">
            <textarea id="chatInput" class="chat-input-compact" aria-label="Chat message"
              placeholder="Type your message, paste code, or describe what you need..." rows="2"
              onkeydown="handleKeyDown(event)"></textarea>
            <button class="btn-send-compact" onclick="sendMessage()" title="Send message">Send</button>
          </div>
          <div class="input-actions-compact">
            <label class="oval-btn file-upload-oval-btn" title="Upload file" aria-label="Upload file">
              <input type="file" id="fileUpload" onchange="handleFileUpload(event)" aria-label="Upload a file" />
              <span aria-hidden="true" style="display:inline-flex;align-items:center;gap:0.3rem;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>Upload</span>
            </label>
            <label class="oval-btn gemini-oval-btn" title="Gemini Model" aria-label="Gemini model selector">
              <select id="geminiModelSelect" class="oval-select" onchange="updateGeminiModel()" title="Gemini Model">
                <option value="gemini-flash-latest" selected>Gemini Flash (latest)</option>
                <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                <option value="gemini-3.1-pro">Gemini 3.1 Pro</option>
                <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              </select>
              <span id="geminiModelDisplay">Gemini</span>
            </label>
            <label class="oval-btn language-oval-btn" title="Programming Language">
              <select id="languageSelect" class="oval-select" onchange="updateLanguage()" title="Programming Language">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="sql">SQL</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="r">R</option>
                <option value="go">Go</option>
                <option value="rust">Rust</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="typescript">TypeScript</option>
                <option value="php">PHP</option>
                <option value="ruby">Ruby</option>
                <option value="swift">Swift</option>
                <option value="kotlin">Kotlin</option>
              </select>
              <span id="languageDisplay">Python</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </main>
{% endblock %}

{% block scripts %}
<!-- JS load order: api-helper.js (head) + Chart.js (head) → auth.js → navigation.js → api-helper.js (body) → ai-agent.js (CodeWriterAgent) → code-assistant.js -->
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/navigation.js"></script>
  <script src="/static/js/api-helper.js"></script>
  <script src="/static/js/ai-agent.js"></script>
  <script src="/static/js/code-assistant.js"></script>
  <script nonce="{{ csp_nonce }}">
    // Require authentication for code assistant
    document.addEventListener('DOMContentLoaded', function () {
      const authManager = new AuthManager();
      if (!authManager.requireAuth()) {
        return; // Will redirect to login
      }
      // Initialize Gemini AI
      initializeGemini();

      // Load preferences and populate model dropdown dynamically
      (async () => {
        const modelSelect = document.getElementById('geminiModelSelect');

        // Fetch available models from backend (falls back to hardcoded list on error)
        try {
          const resp = await fetch(`${window.API_BASE_URL}/ai/models`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
          });
          if (resp.ok) {
            const { models } = await resp.json();
            if (models && models.length) {
              modelSelect.innerHTML = models
                .map(m => `<option value="${m.id}">${m.display_name}</option>`)
                .join('');
            }
          }
        } catch (e) {
          console.warn('Could not fetch model list, using defaults:', e);
        }

        try {
          const prefs = await preferencesAPI.get();
          currentLanguage = prefs.currentLanguage || 'python';
          geminiModel = prefs.geminiModel || 'gemini-flash-latest';

          const langSelect = document.getElementById('languageSelect');
          if (langSelect) langSelect.value = currentLanguage;
          if (modelSelect) modelSelect.value = geminiModel;

          updateLanguage();
          updateGeminiModel();
        } catch (error) {
          console.error('Error loading preferences:', error);
          const savedLang = localStorage.getItem('currentLanguage');
          if (savedLang) {
            currentLanguage = savedLang;
            const langSelect = document.getElementById('languageSelect');
            if (langSelect) langSelect.value = currentLanguage;
            updateLanguage();
          }
          const savedModel = localStorage.getItem('geminiModel');
          if (savedModel) {
            geminiModel = savedModel;
            if (modelSelect) modelSelect.value = geminiModel;
          }
          updateGeminiModel();
        }
      })();

      // Load conversation history
      loadConversationHistory();

      // Initialize new conversation
      if (!currentConversationId) {
        startNewConversation();
      }

      // Initialize sidebar state (start with sidebar hidden)
      const sidebar = document.getElementById('conversationSidebar');
      const fullPage = document.getElementById('codeAssistantPage');
      if (sidebar && fullPage) {
        sidebar.classList.add('hidden');
      }
    });
  </script>
{% endblock %}
