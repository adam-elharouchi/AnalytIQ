services:
  # Web service
  - type: web
    name: analytiq
    env: python
    buildCommand: pip install -r requirements.txt
    # Apply DB migrations ONCE per deploy, before the new version goes live (H-8).
    # It exits non-zero on a failed migration, which blocks the deploy instead of
    # shipping code against a schema that never applied. After confirming this
    # runs, set RUN_MIGRATIONS_ON_BOOT=false so workers stop migrating at boot.
    preDeployCommand: python db_migrate.py
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production

    # Cache-Control headers are set by Flask's after_request hook (app.py):
    #   /api/*  → Cache-Control: no-store, no-cache  (never cached by proxies)
    #   other   → Cache-Control: public, max-age=86400 (Cloudflare caches for 1 day)
    #
    # Render web services do not support route-level headers in render.yaml
    # (that feature is for static sites only).  The Flask headers above are
    # sufficient for Cloudflare to cache /static/js/*, /static/css/*, and image paths.
    #
    # Cloudflare setup (one-time, via Cloudflare dashboard):
    #   1. Add analytiq.com (or your domain) to Cloudflare as a proxied zone.
    #   2. Create a Cache Rule:
    #        URL pattern : analytiq.com/static/js/*
    #                      analytiq.com/static/css/*
    #        Action      : Cache eligibility → Eligible for cache
    #        Edge TTL    : Respect existing headers (honours Cache-Control: public, max-age=86400)
    #   3. Create a Cache Rule for /api/*:
    #        URL pattern : analytiq.com/api/*
    #        Action      : Cache eligibility → Bypass cache
    #      (Belt-and-suspenders: Flask already sends no-store, but this prevents
    #       any accidental caching at the Cloudflare layer.)

  # Celery worker
  - type: worker
    name: analytiq-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: FLASK_ENV
        value: production
