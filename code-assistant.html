<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  
  <main class="code-assistant-fullpage" id="codeAssistantPage">
    <!-- Conversation History Sidebar -->
    <div class="conversation-sidebar" id="conversationSidebar">
      <div class="sidebar-header">
        <h3>Conversation History</h3>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Hide sidebar">←</button>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <div class="conversation-list" id="conversationList">
          <p class="no-conversations">No previous conversations</p>
        </div>
      </div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="chat-main-area">
      <!-- Floating Control Buttons -->
      <div class="floating-controls">
        <button class="sidebar-toggle-btn floating-btn" onclick="toggleSidebar()" title="Show conversation history">☰</button>
      </div>
      
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-section" id="conversationStarters">
          <div class="welcome-message">
            <p>Hello! I'm your Code. Just type your request or paste your code below!</p>
          </div>
          <div class="conversation-starters">
            <div class="starter-grid">
              <button class="starter-btn" onclick="useStarter('Analyze sales data and create visualizations')">
                Analyze sales data and create visualizations
              </button>
              <button class="starter-btn" onclick="useStarter('Build a predictive model for customer churn')">
                Build a predictive model for customer churn
              </button>
              <button class="starter-btn" onclick="useStarter('Perform statistical analysis on revenue trends')">
                Perform statistical analysis on revenue trends
              </button>
              <button class="starter-btn" onclick="useStarter('Create a dashboard for business metrics')">
                Create a dashboard for business metrics
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="chat-input-area-fixed">
        <div class="input-container-compact">
          <div class="input-wrapper">
            <textarea 
              id="chatInput" 
              class="chat-input-compact" 
              placeholder="Type your message, paste code, or describe what you need..."
              rows="2"
              onkeydown="handleKeyDown(event)"
            ></textarea>
            <button class="btn-send-compact" onclick="sendMessage()" title="Send message">Send</button>
          </div>
          <div class="input-actions-compact">
            <label class="oval-btn file-upload-oval-btn" title="Upload file">
              <input type="file" id="fileUpload" onchange="handleFileUpload(event)" />
              <span>📎 Upload</span>
            </label>
            <label class="oval-btn gemini-oval-btn" title="Gemini Model">
              <select id="geminiModelSelect" class="oval-select" onchange="updateGeminiModel()" title="Gemini Model">
                <option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>
                <option value="gemini-3-pro-preview">gemini-3-pro-preview</option>
                <option value="gemini-3-flash">gemini-3-flash</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro</option>
              </select>
              <span id="geminiModelDisplay">Gemini</span>
            </label>
            <label class="oval-btn language-oval-btn" title="Programming Language">
              <select id="languageSelect" class="oval-select" onchange="updateLanguage()" title="Programming Language">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="sql">SQL</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="r">R</option>
                <option value="go">Go</option>
                <option value="rust">Rust</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="typescript">TypeScript</option>
                <option value="php">PHP</option>
                <option value="ruby">Ruby</option>
                <option value="swift">Swift</option>
                <option value="kotlin">Kotlin</option>
              </select>
              <span id="languageDisplay">Python</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/local-intelligence.js"></script>
  <script src="js/ai-agent.js"></script>
  <script src="js/code-assistant.js"></script>
  <script>
    // Require authentication for code assistant
    document.addEventListener('DOMContentLoaded', function() {
      const authManager = new AuthManager();
      if (!authManager.requireAuth()) {
        return; // Will redirect to login
      }
      // Initialize Gemini AI
      initializeGemini();
      
      // Load conversation history
      loadConversationHistory();
      
      // Initialize new conversation
      if (!currentConversationId) {
        startNewConversation();
      }
      
      // Initialize sidebar state
      const sidebar = document.getElementById('conversationSidebar');
      const fullPage = document.getElementById('codeAssistantPage');
      if (sidebar && fullPage) {
        if (sidebar.classList.contains('hidden')) {
          fullPage.classList.add('sidebar-hidden');
        } else {
          fullPage.classList.add('sidebar-visible');
        }
      }
      
      // Initialize displays
      updateGeminiModel();
      updateLanguage();
    });
  </script>
</body>
</html>
