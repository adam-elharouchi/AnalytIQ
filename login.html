<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // INSTANT dark mode application - runs before page renders to prevent flash
    (function() {
      try {
        const darkMode = localStorage.getItem('darkModeEnabled');
        if (darkMode === 'true') {
          document.documentElement.setAttribute('data-theme', 'dark');
          // Add class to html element - body will inherit via CSS
          document.documentElement.classList.add('dark-mode');
          // Apply to body when it's available
          if (document.body) {
            document.body.classList.add('dark-mode');
          } else {
            // Wait for body to be available
            document.addEventListener('DOMContentLoaded', function() {
              document.body.classList.add('dark-mode');
            });
          }
        }
      } catch(e) {}
    })();
  </script>
  <script src="js/api-helper.js"></script>
  <script src="js/dark-mode.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1><span class="logo-analyt">Analyt</span><span class="logo-iq">IQ</span></h1>
        <p>Sign in to access Code and learning resources</p>
      </div>
      
      <div class="login-tabs">
        <button class="login-tab active" onclick="showTab('signin', this)">Sign In</button>
        <button class="login-tab" onclick="showTab('signup', this)">Sign Up</button>
      </div>
      
      <div id="signinTab" class="login-tab-content active">
        <form id="signinForm" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label for="signinEmail">Email</label>
            <input type="email" id="signinEmail" required placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signinPassword">Password</label>
            <input type="password" id="signinPassword" required placeholder="Enter your password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
          <div id="signinError" class="error-message" style="display: none;"></div>
        </form>
      </div>
      
      <div id="signupTab" class="login-tab-content">
        <form id="signupForm" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" required placeholder="John Doe" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" required placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" required placeholder="Create a password" minlength="6" autocomplete="new-password" />
            <small>Minimum 6 characters</small>
          </div>
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" required placeholder="Confirm your password" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
          <div id="signupError" class="error-message" style="display: none;"></div>
        </form>
      </div>
      
      <div class="login-footer">
        <p>By signing in, you agree to our Terms of Service and Privacy Policy</p>
      </div>
    </div>
  </div>
  
  <script src="js/email-service.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
