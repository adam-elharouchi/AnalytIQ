<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sign In - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/api-helper.js"></script>

</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1><span class="logo-analyt">Analyt</span><span class="logo-iq">IQ</span></h1>
        <p>Sign in to access Code and learning resources</p>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" onclick="showTab('signin', this)">Sign In</button>
        <button class="login-tab" onclick="showTab('signup', this)">Sign Up</button>
      </div>

      <div id="signinTab" class="login-tab-content active">
        <form id="signinForm" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label for="signinEmail">Email</label>
            <input type="email" id="signinEmail" required placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signinPassword">Password</label>
            <input type="password" id="signinPassword" required placeholder="Enter your password"
              autocomplete="current-password" />
            <div style="text-align: right; margin-top: 0.5rem;">
              <a href="#" onclick="showForgotPasswordModal(event)"
                style="color: #2569f4; text-decoration: none; font-size: 0.875rem;">Forgot Password?</a>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
          <div id="signinError" class="error-message" style="display: none;"></div>
        </form>
      </div>

      <div id="signupTab" class="login-tab-content">
        <form id="signupForm" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" required placeholder="John Doe" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" required placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" required placeholder="Create a password" minlength="6"
              autocomplete="new-password" />
            <small>Minimum 6 characters</small>
          </div>
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" required placeholder="Confirm your password"
              autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
          <div id="signupError" class="error-message" style="display: none;"></div>
        </form>
      </div>

      <div class="login-footer">
        <p>By signing in, you agree to our Terms of Service and Privacy Policy</p>
      </div>
    </div>
  </div>


  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2>Reset Password</h2>
        <button class="modal-close" onclick="closeForgotPasswordModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #64748b; margin-bottom: 1.5rem;">Enter your email address and we'll send you instructions to
          reset your password.</p>
        <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
          <div class="form-group">
            <label for="resetEmail">Email Address</label>
            <input type="email" id="resetEmail" required placeholder="your@email.com" autocomplete="email" />
          </div>
          <div id="resetSuccess" class="success-message"
            style="display: none; background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
          </div>
          <div id="resetError" class="error-message" style="display: none;"></div>
          <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <button type="button" class="btn btn-secondary" onclick="closeForgotPasswordModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>

</html>
