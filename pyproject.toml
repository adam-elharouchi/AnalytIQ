[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
# Security scanning config (CI runs: bandit -c pyproject.toml -r . --severity-level medium,
# GATING). Non-runtime and test trees are excluded — tests intentionally contain
# dummy secrets and subprocess use.
exclude_dirs = [".venv", "venv", "tests", "scripts", "static", "frontend", ".git"]

# B608 (hardcoded_sql_expressions) is skipped after a full manual audit of all 19
# flagged sites (2026-07-17). Every one builds dynamic SQL *structure* only from
# ALLOWLISTED identifier fragments chosen in code — e.g.
#   ", ".join("col = %s" for ...)                       (fixed column literals)
#   {k: v for k, v in data.items() if k in allowed}     (key allowlist filter)
# — while ALL user *values* are bound through psycopg2 %s parameters. Bandit rates
# a genuine value injection  f"... = '{user_input}'"  and this safe fragment
# pattern IDENTICALLY (MEDIUM severity / MEDIUM confidence), so B608 cannot
# distinguish them in this codebase and yields only false positives here. The
# compensating control is the centralized repository pattern (allowlist keys +
# parameterized values), enforced in code review. See docs/SECURITY.md.
# If you add dynamic SQL, keep that pattern — never interpolate a user value.
skips = ["B608"]
