<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Users Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #0f3460;
            margin-bottom: 20px;
        }
        .info {
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        button {
            background: #533483;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #6a4c93;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eee;
            border: 1px solid #533483;
            font-family: monospace;
            margin-top: 10px;
        }
        .success {
            background: #0f5132;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .error {
            background: #842029;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .copy-btn {
            background: #0f5132;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background: #157347;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Export Users Data from localStorage</h1>
        
        <div class="info">
            <p>This tool will export all user data from your browser's localStorage and prepare it for migration to the Supabase database.</p>
        </div>

        <button onclick="exportUsers()">Export Users Data (JSON)</button>
        <button onclick="exportAll()">Export All User Data - JSON</button>
        <button onclick="exportToCSV()">Export Users to CSV</button>

        <div id="output"></div>
    </div>

    <script>
        function exportUsers() {
            try {
                const usersStr = localStorage.getItem('users');
                const users = usersStr ? JSON.parse(usersStr) : [];
                
                if (users.length === 0) {
                    showOutput('No users found in localStorage.', 'error');
                    return;
                }

                const output = JSON.stringify(users, null, 2);
                showOutput(output, 'success', true);
            } catch (error) {
                showOutput('Error exporting users: ' + error.message, 'error');
            }
        }

        function exportAll() {
            try {
                const usersStr = localStorage.getItem('users');
                const currentUserStr = localStorage.getItem('currentUser');
                const profileStr = localStorage.getItem('userProfile');
                const settingsStr = localStorage.getItem('userSettings');

                const users = usersStr ? JSON.parse(usersStr) : [];
                const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
                const profile = profileStr ? JSON.parse(profileStr) : {};
                const settings = settingsStr ? JSON.parse(settingsStr) : {};

                const exportData = {
                    users: users,
                    currentUser: currentUser,
                    profiles: {},
                    settings: {}
                };

                // If we have profile/settings data, attach it to the corresponding user
                if (currentUser && currentUser.email) {
                    const user = users.find(u => u.email === currentUser.email);
                    if (user) {
                        exportData.profiles[user.id] = {
                            ...profile,
                            fullName: profile.fullName || currentUser.name,
                            email: profile.email || currentUser.email
                        };
                        exportData.settings[user.id] = settings;
                    }
                }

                if (users.length === 0) {
                    showOutput('No users found in localStorage.', 'error');
                    return;
                }

                const output = JSON.stringify(exportData, null, 2);
                showOutput(output, 'success', true);
            } catch (error) {
                showOutput('Error exporting data: ' + error.message, 'error');
            }
        }

        function showOutput(text, type, showCopy = false) {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = `
                <div class="${type}">
                    <h3>${type === 'success' ? 'Export Successful!' : 'Error'}</h3>
                    <p>${type === 'success' ? 'Copy the JSON data below and save it to users_export.json or paste it into the migration script:' : text}</p>
                    ${type === 'success' ? `
                        <textarea id="exportData" readonly>${text}</textarea>
                        ${showCopy ? '<button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>' : ''}
                        <button onclick="downloadJSON()">Download as JSON File</button>
                    ` : ''}
                </div>
            `;
        }

        function copyToClipboard() {
            const textarea = document.getElementById('exportData');
            textarea.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        function downloadJSON() {
            const textarea = document.getElementById('exportData');
            const data = textarea.value;
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'users_export.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportToCSV() {
            try {
                const usersStr = localStorage.getItem('users');
                const currentUserStr = localStorage.getItem('currentUser');
                const profileStr = localStorage.getItem('userProfile');
                const settingsStr = localStorage.getItem('userSettings');

                const users = usersStr ? JSON.parse(usersStr) : [];
                const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
                const profile = profileStr ? JSON.parse(profileStr) : {};
                const settings = settingsStr ? JSON.parse(settingsStr) : {};

                if (users.length === 0) {
                    showOutput('No users found in localStorage.', 'error');
                    return;
                }

                // Create CSV header
                const headers = ['id', 'name', 'email', 'password_hash', 'fullName', 'bio', 'profilePicture', 'emailNotifications', 'darkMode'];
                let csv = headers.join(',') + '\n';

                // Add user data
                users.forEach(user => {
                    const isCurrentUser = currentUser && user.email === currentUser.email;
                    const userProfile = isCurrentUser ? profile : {};
                    const userSettings = isCurrentUser ? settings : {};

                    // Escape CSV values (handle commas, quotes, newlines)
                    const escapeCSV = (value) => {
                        if (value === null || value === undefined) return '';
                        const str = String(value);
                        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                            return '"' + str.replace(/"/g, '""') + '"';
                        }
                        return str;
                    };

                    const row = [
                        escapeCSV(user.id || ''),
                        escapeCSV(user.name || ''),
                        escapeCSV(user.email || ''),
                        escapeCSV(user.password || ''),
                        escapeCSV(userProfile.fullName || user.name || ''),
                        escapeCSV(userProfile.bio || ''),
                        escapeCSV(userProfile.profilePicture || currentUser?.profilePicture || ''),
                        escapeCSV(userSettings.emailNotifications || false),
                        escapeCSV(userSettings.darkMode || false)
                    ];
                    csv += row.join(',') + '\n';
                });

                // Create download
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'users_export.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showOutput('CSV file downloaded successfully!', 'success');
            } catch (error) {
                showOutput('Error exporting to CSV: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
