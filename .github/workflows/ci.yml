name: AnalytIQ CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements-dev.txt pulls in requirements.txt plus the test/lint tools.
        pip install -r requirements-dev.txt

    - name: Run linting (flake8)
      run: |
        python -m flake8 app.py config.py blueprints/ repositories/ core/ services/ workers/ --max-line-length=120 --count --show-source --statistics

    - name: Check code formatting (black)
      run: |
        python -m black --check app.py config.py blueprints/ repositories/ core/ services/ workers/

    - name: Run type checking (mypy)
      run: |
        python -m mypy app.py config.py blueprints/ repositories/ core/ services/ workers/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        FEATURE_CACHING: True
        FEATURE_ASYNC_TASKS: False
        SECRET_KEY: test-secret-key-for-ci
      run: |
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --ignore=tests/e2e
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Run security scan (bandit)
      continue-on-error: true
      run: |
        pip install bandit
        bandit -r . --exclude ./.venv,./tests,./scripts,./static -ll -f json -o bandit-report.json

    - name: Dependency vulnerability scan (pip-audit)
      # GATING: fails the build on a known CVE in a production dependency
      # (requirements.txt only; dev tools live in requirements-dev.txt).
      #
      # The --ignore-vuln entries below are advisories whose fix requires Python
      # >=3.10 (this project runs 3.9) AND which are not exploitable here. REMOVE
      # them after the Python 3.9 -> 3.11 upgrade lets the fixed versions install:
      #   PYSEC-2026-2270  python-dotenv  set_key/unset_key symlink — app never writes .env
      #   PYSEC-2026-2132  click          command injection in click.edit() — never called
      #   PYSEC-2026-2275  requests       predictable temp path in extract_zipped_paths() — never called
      #   PYSEC-2026-141   urllib3        cross-origin header forwarding via low-level ProxyManager API — not used
      #   PYSEC-2026-142   urllib3        decompression DoS on partial reads — not used
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt --desc \
          --ignore-vuln PYSEC-2026-2270 \
          --ignore-vuln PYSEC-2026-2132 \
          --ignore-vuln PYSEC-2026-2275 \
          --ignore-vuln PYSEC-2026-141 \
          --ignore-vuln PYSEC-2026-142

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  deploy-notification:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Deployment notification
      run: |
        echo "✅ All checks passed! Ready for Render deployment."
        echo "🚀 Render will auto-deploy from main branch."
