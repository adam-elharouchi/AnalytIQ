name: AnalytIQ CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements-dev.txt pulls in requirements.txt plus the test/lint tools.
        pip install -r requirements-dev.txt

    - name: Run linting (flake8)
      run: |
        python -m flake8 app.py config.py blueprints/ repositories/ core/ services/ workers/ --max-line-length=120 --count --show-source --statistics

    - name: Check code formatting (black)
      run: |
        python -m black --check app.py config.py blueprints/ repositories/ core/ services/ workers/

    - name: Run type checking (mypy)
      run: |
        python -m mypy app.py config.py blueprints/ repositories/ core/ services/ workers/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        FEATURE_CACHING: True
        FEATURE_ASYNC_TASKS: False
        SECRET_KEY: test-secret-key-for-ci
      run: |
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --ignore=tests/e2e
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Security scan (bandit) — full report artifact
      # Non-gating: captures ALL findings (incl. LOW) for periodic review. Config
      # (exclude_dirs + the documented B608 skip) lives in pyproject.toml.
      run: |
        pip install bandit
        bandit -c pyproject.toml -r . -f json -o bandit-report.json || true

    - name: Security scan (bandit) — GATING on MEDIUM+ severity
      # Fails the build on any MEDIUM- or HIGH-severity finding. The triage that
      # got this to zero (all 19 B608 audited as parameterized-query false
      # positives → skipped in config; the single B104 0.0.0.0 bind → nosec'd) is
      # recorded in pyproject.toml [tool.bandit] and app.py. New MEDIUM+ findings
      # (shell=True, eval, pickle, yaml.load, weak hash, …) will block CI.
      run: |
        bandit -c pyproject.toml -r . --severity-level medium

    - name: Dependency vulnerability scan (pip-audit)
      # GATING: fails the build on a known CVE in a production dependency
      # (requirements.txt only; dev tools live in requirements-dev.txt). The
      # Python 3.9 -> 3.11 upgrade let the previously-unfixable transitive CVEs
      # (python-dotenv, click, requests, urllib3) be pinned to their fixed
      # versions, so the per-advisory --ignore-vuln allowlist is no longer needed.
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt --desc

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  deploy-notification:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Deployment notification
      run: |
        echo "✅ All checks passed! Ready for Render deployment."
        echo "🚀 Render will auto-deploy from main branch."
