<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Manage Profile - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/api-helper.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ui-states.js"></script>
  <script src="js/offline-detector.js"></script>
  <!-- LOCAL DEV ONLY: dark theme — remove before deploy -->
</head>

<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="profile-container">
      <h1>Manage Profile</h1>

      <div class="profile-content">
        <!-- Profile Picture Section -->
        <div class="profile-section">
          <h2>Profile Picture</h2>
          <div class="profile-picture-section">
            <div class="profile-picture-container">
              <img id="profilePicture" src="" alt="Profile Picture" class="profile-picture" />
              <div class="profile-picture-overlay">
                <label for="profilePictureInput" class="profile-picture-upload-btn">
                  <span>📷</span>
                  <span>Change Photo</span>
                </label>
                <input type="file" id="profilePictureInput" accept="image/*" style="display: none;" />
              </div>
            </div>
            <p class="profile-picture-hint">Click to upload a new profile picture</p>
          </div>
        </div>

        <!-- Personal Information Section -->
        <div class="profile-section">
          <h2>Personal Information</h2>
          <form id="personalInfoForm" class="profile-form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Enter your full name"
                autocomplete="name" />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email"
                autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="bio">Bio</label>
              <textarea id="bio" name="bio" class="form-textarea" rows="4"
                placeholder="Tell us about yourself..."></textarea>
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
          </form>
          </form>
        </div>

        <!-- Notifications Section -->
        <div class="profile-section">
          <h2>Notifications</h2>
          <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="emailNotifications" name="emailNotifications">
            <label for="emailNotifications" style="margin-bottom: 0;">Receive email notifications</label>
          </div>
        </div>

        <!-- Change Password Section -->
        <div class="profile-section">
          <h2>Change Password</h2>
          <form id="passwordForm" class="profile-form">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" name="currentPassword" class="form-input"
                placeholder="Enter current password" autocomplete="current-password" />
            </div>
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" name="newPassword" class="form-input"
                placeholder="Enter new password" autocomplete="new-password" />
              <small class="form-hint">Password must be at least 8 characters long</small>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm New Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                placeholder="Confirm new password" autocomplete="new-password" />
            </div>
            <button type="submit" class="btn-primary">Update Password</button>
          </form>
        </div>


        <!-- Danger Zone -->
        <div class="profile-section danger-zone">
          <h2>Danger Zone</h2>
          <p class="danger-zone-warning">⚠️ These actions cannot be undone. Please be careful.</p>
          <div class="danger-actions">
            <button type="button" class="btn-danger" onclick="deleteAccount()">Delete Account</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- JS load order: api-helper.js (head) → auth.js → navigation.js → profile.js -->
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/profile.js"></script>
  <script>
    // Require authentication
    document.addEventListener('DOMContentLoaded', function () {
      const authManager = new AuthManager();
      if (!authManager.requireAuth()) {
        return; // Will redirect to login
      }
    });
  </script>
</body>

</html>
