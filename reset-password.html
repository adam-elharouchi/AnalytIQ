<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Reset Password - AnalytIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/api-helper.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ui-states.js"></script>
  <script src="js/offline-detector.js"></script>
  <!-- LOCAL DEV ONLY: dark theme — remove before deploy -->
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1><span class="logo-analyt">Analyt</span><span class="logo-iq">IQ</span></h1>
        <p>Set a new password for your account</p>
      </div>

      <div id="invalidLink" style="display: none;">
        <p style="color: #64748b; margin-bottom: 1rem;">This reset link is invalid or missing. Request a new one from the login page.</p>
        <a href="login.html" class="btn btn-primary">Back to Sign In</a>
      </div>

      <div id="resetFormWrap" style="display: none;">
        <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required placeholder="Enter new password" minlength="8"
              autocomplete="new-password" />
            <small>Minimum 8 characters</small>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="Confirm new password"
              autocomplete="new-password" />
          </div>
          <div id="resetError" class="error-message" style="display: none;"></div>
          <div id="resetSuccess" class="success-message"
            style="display: none; background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;"></div>
          <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
        </form>
      </div>

      <div id="successState" style="display: none;">
        <p style="color: #065f46; margin-bottom: 1rem;">Your password has been reset. You can now sign in with your new password.</p>
        <a href="login.html" class="btn btn-primary btn-full">Sign In</a>
      </div>

      <div class="login-footer" style="margin-top: 1.5rem;">
        <a href="login.html" style="color: var(--color-primary); text-decoration: none; font-size: 0.875rem;">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    if (!token || !email) {
      document.getElementById('invalidLink').style.display = 'block';
    } else {
      document.getElementById('resetFormWrap').style.display = 'block';
    }

    async function handleResetPassword(event) {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('resetError');
      const successDiv = document.getElementById('resetSuccess');
      const submitBtn = event.target.querySelector('button[type="submit"]');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.style.display = 'block';
        return;
      }
      if (newPassword.length < 8) {
        errorDiv.textContent = 'Password must be at least 8 characters.';
        errorDiv.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const apiBase = window.API_BASE_URL || '/api';
        const response = await fetch(apiBase + '/users/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            email: email,
            newPassword: newPassword
          })
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to reset password');
        }

        document.getElementById('resetFormWrap').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    }
  </script>
</body>

</html>
